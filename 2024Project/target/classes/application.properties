# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=cs.dit.model

# 데이터베이스 설정 (log4jdbc + MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/jmaxdb
spring.datasource.username=jmax
spring.datasource.password=1111
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate/JPA 설정 (선택 사항)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 로깅 설정
logging.level.org.springframework.web=DEBUG
logging.level.cs.dit=DEBUG

# 서버 포트 설정
server.port=8080
