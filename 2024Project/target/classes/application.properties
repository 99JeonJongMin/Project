# ✅ JSP 뷰 리졸버 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.context-path=/

# ✅ MyBatis 설정
mybatis.type-aliases-package=cs.dit.domain
mybatis.mapper-locations=classpath:mapper/**/*.xml  # 추가
mybatis.configuration.map-underscore-to-camel-case=true


# ✅ 데이터베이스 설정 (MySQL / MariaDB)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql.railway.internal}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ✅ 서버 포트 및 인코딩 설정
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ✅ 정적 리소스 설정 (src/main/resources/static 또는 src/main/webapp/resources 중 하나 선택)
spring.web.resources.static-locations=classpath:/resources/

