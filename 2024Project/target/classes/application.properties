spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis 설정 (도메인 패키지 설정)
mybatis.type-aliases-package=cs.dit.domain


# 데이터베이스 설정 (로컬 환경 - MariaDB 사용)
spring.datasource.url=jdbc:mariadb://localhost:3306/jmaxdb?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=jmax
spring.datasource.password=1111
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정 (MariaDB 용 Hibernate Dialect 사용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 서버 포트 설정
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.context-path=/controller
