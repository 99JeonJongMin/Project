spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# MyBatis 설정
mybatis.type-aliases-package=cs.dit.domain
mybatis.mapper-locations=classpath:mapper/**/*.xml  # 추가

# 데이터베이스 설정 (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/jmaxdb?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=jmax
spring.datasource.password=1111
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 서버 포트 설정
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.context-path=/